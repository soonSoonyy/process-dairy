# Process Diary - English (default). Korean: ProcessDiaryBundle_ko.properties
# Messages with parameters use MessageFormat: {0}, {1}; write a literal apostrophe as ''.

# ---- Process descriptions (desc.proc.<process name>)
desc.proc.launchd=The very first process on macOS that starts and manages every other process (PID 1). It cannot be stopped.
desc.proc.kernel_task=The macOS kernel itself. When the CPU runs hot it may deliberately occupy CPU time to reduce heat.
desc.proc.WindowServer=Core system process that draws windows and graphics on screen. Stopping it logs you out.
desc.proc.loginwindow=Handles login, logout and the user session.
desc.proc.Finder=Finder: file browsing and the desktop. It restarts automatically if stopped.
desc.proc.Dock=Dock, Mission Control and desktop switching.
desc.proc.SystemUIServer=Draws the system icons on the right side of the menu bar.
desc.proc.ControlCenter=Control Center in the menu bar (Wi-Fi, Bluetooth, brightness, ...).
desc.proc.NotificationCenter=Notification Center and widgets.
desc.proc.mds=Manages the Spotlight metadata index.
desc.proc.mds_stores=Stores and maintains the Spotlight index on disk. May use a lot of CPU right after moving many files.
desc.proc.mdworker_shared=Spotlight worker that reads file contents for indexing.
desc.proc.coreaudiod=Handles all audio input and output (speakers, microphone).
desc.proc.bluetoothd=Manages Bluetooth device connections.
desc.proc.cfprefsd=Reads and writes preference values for apps and the system.
desc.proc.fseventsd=Records file change events and reports them to Spotlight, Time Machine and others.
desc.proc.cloudd=iCloud data synchronization.
desc.proc.bird=iCloud Drive file synchronization.
desc.proc.backupd=Runs Time Machine backups.
desc.proc.softwareupdated=Checks for and downloads macOS software updates.
desc.proc.sharingd=AirDrop, Handoff and other sharing between devices.
desc.proc.Safari=The Safari web browser.
desc.proc.Terminal=The Terminal app.
desc.proc.iTerm2=The iTerm2 terminal app.
desc.proc.System=Windows kernel and drivers. It cannot be stopped.
desc.proc.explorer=Windows Explorer: taskbar, Start menu and desktop.
desc.proc.svchost=Shared host process that runs several Windows services.
desc.proc.csrss=Core Windows system process (console and threads). Stopping it halts the system.
desc.proc.winlogon=Handles Windows login and logout.
desc.proc.services=Windows service manager that starts and stops services.
desc.proc.lsass=Handles Windows login authentication and security policy. Stopping it reboots the computer.
desc.proc.dwm=Desktop Window Manager: composes the screen (transparency, animations).
desc.proc.MsMpEng=Microsoft Defender antivirus engine. May use a lot of CPU while scanning.
desc.proc.SearchIndexer=Builds the Windows search index.
desc.proc.RuntimeBroker=Manages permissions (location, microphone, ...) for Store apps.
desc.proc.conhost=Host that draws command prompt / console windows.
desc.proc.taskhostw=Runs Windows scheduled and background tasks.
desc.proc.idea=IntelliJ IDEA (possibly the IDE you are using right now).
desc.proc.idea64=IntelliJ IDEA (possibly the IDE you are using right now).
desc.proc.java=A Java program. It may be a Gradle daemon, a Spring server, etc. Check the command line.
desc.proc.node=A Node.js (JavaScript) program, often a development server.
desc.proc.python=A Python script. Check the command line to see which script.
desc.proc.python3=A Python script. Check the command line to see which script.
desc.proc.ruby=A Ruby program.
desc.proc.docker=A Docker-related process.
desc.proc.ssh=An SSH connection to another computer.
desc.proc.sshd=Server that accepts SSH connections.
desc.proc.zsh=The zsh shell (reads commands typed in a terminal).
desc.proc.bash=The bash shell (reads commands typed in a terminal).
desc.proc.fsnotifier=Helper that IntelliJ uses to detect file changes.

# ---- Generic descriptions
desc.helper=A helper process started by the app "{0}" to split up its work{1}. Browsers and Electron apps start several, per tab or feature.
desc.helper.renderer=\ (renders web pages)
desc.helper.gpu=\ (graphics)
desc.helper.plugin=\ (runs plugins)
desc.system.daemon=A system service (daemon/agent) the operating system runs in the background. A trailing "d" usually means daemon. Better not to stop it.
desc.system=A system process that is part of the operating system.
desc.app=A process of the app "{0}".
desc.shell=A shell process that reads commands typed in a terminal.
desc.dev=A development tool or a program installed with a package manager. Check the command line for details.
desc.other=An unclassified process. Look at the path and command line to see what it is.

