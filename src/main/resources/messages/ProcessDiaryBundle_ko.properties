# Process Diary - 한국어
# 매개변수가 있는 메시지는 MessageFormat 규칙: {0}, {1}, 작은따옴표는 '' 로 씀

# ---- 프로세스 설명 (desc.proc.<프로세스 이름>)
desc.proc.launchd=맥의 모든 프로세스를 시작하고 관리하는 가장 첫 번째 프로세스입니다. (PID 1) 종료할 수 없습니다.
desc.proc.kernel_task=macOS 커널 자체입니다. CPU 온도가 높으면 일부러 CPU를 점유해 발열을 낮추기도 합니다.
desc.proc.WindowServer=화면에 창과 그래픽을 그려주는 핵심 시스템 프로세스입니다. 종료하면 로그아웃됩니다.
desc.proc.loginwindow=로그인/로그아웃과 사용자 세션을 관리합니다.
desc.proc.Finder=파인더. 파일 탐색과 바탕화면을 담당합니다. 종료해도 자동으로 다시 실행됩니다.
desc.proc.Dock=Dock과 Mission Control, 데스크탑 전환을 담당합니다.
desc.proc.SystemUIServer=메뉴 막대 오른쪽의 시스템 아이콘을 그립니다.
desc.proc.ControlCenter=메뉴 막대의 제어 센터(Wi-Fi, 블루투스, 밝기 등)입니다.
desc.proc.NotificationCenter=알림 센터와 위젯을 담당합니다.
desc.proc.mds=Spotlight 검색용 메타데이터 인덱스를 관리합니다.
desc.proc.mds_stores=Spotlight 검색 인덱스를 디스크에 저장·관리합니다. 큰 파일을 옮긴 직후엔 CPU를 많이 쓸 수 있습니다.
desc.proc.mdworker_shared=Spotlight이 파일 내용을 읽어 색인하는 작업자입니다.
desc.proc.coreaudiod=맥의 모든 소리 입출력(스피커, 마이크)을 관리합니다.
desc.proc.bluetoothd=블루투스 기기 연결을 관리합니다.
desc.proc.cfprefsd=앱과 시스템의 환경설정 값을 읽고 쓰는 것을 중계합니다.
desc.proc.fseventsd=파일 변경 이벤트를 기록해 Spotlight, Time Machine 등에 알려줍니다.
desc.proc.cloudd=iCloud 데이터 동기화를 담당합니다.
desc.proc.bird=iCloud Drive 파일 동기화를 담당합니다.
desc.proc.backupd=Time Machine 백업을 실행합니다.
desc.proc.softwareupdated=macOS 소프트웨어 업데이트를 확인하고 내려받습니다.
desc.proc.sharingd=AirDrop, Handoff 등 기기 간 공유 기능을 담당합니다.
desc.proc.Safari=Safari 웹 브라우저입니다.
desc.proc.Terminal=터미널 앱입니다.
desc.proc.iTerm2=iTerm2 터미널 앱입니다.
desc.proc.System=Windows 커널과 드라이버가 동작하는 시스템 프로세스입니다. 종료할 수 없습니다.
desc.proc.explorer=Windows 탐색기. 작업 표시줄, 시작 메뉴, 바탕화면을 담당합니다.
desc.proc.svchost=Windows 서비스 여러 개를 묶어서 실행하는 공용 호스트 프로세스입니다.
desc.proc.csrss=Windows 핵심 시스템 프로세스(콘솔/스레드 관리)입니다. 종료하면 시스템이 멈춥니다.
desc.proc.winlogon=Windows 로그인/로그아웃을 처리합니다.
desc.proc.services=Windows 서비스들을 시작·중지하는 서비스 관리자입니다.
desc.proc.lsass=Windows 로그인 인증과 보안 정책을 처리합니다. 종료하면 재부팅됩니다.
desc.proc.dwm=창 화면 합성(투명 효과, 애니메이션)을 담당하는 데스크톱 창 관리자입니다.
desc.proc.MsMpEng=Microsoft Defender 바이러스 백신 엔진입니다. 검사 중엔 CPU를 많이 쓸 수 있습니다.
desc.proc.SearchIndexer=Windows 검색 색인을 만듭니다.
desc.proc.RuntimeBroker=스토어 앱의 권한(위치, 마이크 등)을 관리합니다.
desc.proc.conhost=명령 프롬프트/콘솔 창을 그려주는 호스트입니다.
desc.proc.taskhostw=Windows 예약 작업과 백그라운드 작업을 실행합니다.
desc.proc.idea=IntelliJ IDEA (지금 사용 중인 IDE일 수 있습니다).
desc.proc.idea64=IntelliJ IDEA (지금 사용 중인 IDE일 수 있습니다).
desc.proc.java=Java 프로그램을 실행 중입니다. Gradle 데몬, Spring 서버 등일 수 있으니 실행 명령을 확인하세요.
desc.proc.node=Node.js(자바스크립트) 프로그램을 실행 중입니다. 개발 서버인 경우가 많습니다.
desc.proc.python=Python 스크립트를 실행 중입니다. 실행 명령에서 어떤 스크립트인지 확인하세요.
desc.proc.python3=Python 스크립트를 실행 중입니다. 실행 명령에서 어떤 스크립트인지 확인하세요.
desc.proc.ruby=Ruby 프로그램을 실행 중입니다.
desc.proc.docker=Docker 관련 프로세스입니다.
desc.proc.ssh=SSH로 다른 컴퓨터에 접속 중입니다.
desc.proc.sshd=SSH 접속을 받아주는 서버입니다.
desc.proc.zsh=zsh 셸(터미널에서 명령을 입력받는 프로그램)입니다.
desc.proc.bash=bash 셸(터미널에서 명령을 입력받는 프로그램)입니다.
desc.proc.fsnotifier=IntelliJ가 파일 변경을 감지하기 위해 쓰는 보조 프로그램입니다.

