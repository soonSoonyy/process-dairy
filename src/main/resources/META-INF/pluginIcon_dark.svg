<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E5BFF"/>
      <stop offset="1" stop-color="#2F8CFF"/>
    </linearGradient>
  </defs>
  <!-- 일기장(diary) 모양: 둥근 사각형 + 왼쪽 묶음 줄 -->
