  <rect x="7" y="2" width="3" height="36" fill="#000000" opacity="0.18"/>
  <!-- 사용량 막대 -->
  <rect x="14" y="22" width="4" height="10" rx="1.2" fill="#FFFFFF" opacity="0.95"/>
  <rect x="20.5" y="16" width="4" height="16" rx="1.2" fill="#FFFFFF" opacity="0.95"/>
  <rect x="27" y="11" width="4" height="21" rx="1.2" fill="#FFFFFF" opacity="0.95"/>
  <!-- 박동 선 -->
  <polyline points="13,13 17,13 19,8 22,17 24,12 32,12" fill="none" stroke="#FFE066" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
